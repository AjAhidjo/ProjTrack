<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Supervisor Login | ProjTrack</title>
    <style>
        .show-pass-container { display: flex; align-items: center; margin: 10px 0 20px 0; cursor: pointer; user-select: none; }
        .tiny-box { width: 16px; height: 16px; border: 2px solid #cbd5e1; border-radius: 3px; background: white; margin-right: 8px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        #showPassCheck { display: none; }
        #showPassCheck:checked + .tiny-box { background: #10b981; border-color: #10b981; }
        #showPassCheck:checked + .tiny-box::after { content: '✔'; color: white; font-size: 10px; }
        .show-pass-text { font-size: 0.85rem; color: #64748b; font-weight: 600; }
    </style>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8fafc; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 400px; border-top: 5px solid #10b981;">
        <h2 style="text-align: center; color: #1e293b; margin-bottom: 5px;">SUPERVISOR LOGIN</h2>
        <p style="text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 30px;">Review and manage student projects</p>

        {% with msgs = get_flashed_messages(with_categories=true) %}
            {% for category, m in msgs %}
                <div class="card flash-msg" style="
                    background: {% if category == 'success' %}#d1fae5{% else %}#fee2e2{% endif %};
                    color: {% if category == 'success' %}#065f46{% else %}#991b1b{% endif %};
                    padding:15px; border-radius:8px; margin-bottom:20px;
                    border-left: 5px solid {% if category == 'success' %}#10b981{% else %}#ef4444{% endif %};">
                    {{ m }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label style="font-weight: 600; font-size: 0.85rem;">Staff Username</label>
            <input type="text" name="username" placeholder="Enter staff ID" required>

            <label style="font-weight: 600; font-size: 0.85rem;">Password</label>
            <input type="password" name="password" id="loginPass" placeholder="••••••••" required>

            <label class="show-pass-container">
                <input type="checkbox" id="showPassCheck" onclick="togglePassword()">
                <div class="tiny-box"></div>
                <span class="show-pass-text">Show Password</span>
            </label>

            <button type="submit" style="width: 100%; margin-top: 10px; background: #10b981;">Supervisor Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 15px; font-size: 0.85rem;">
            <a href="/forgot-password" style="color: #64748b; text-decoration: none;">Forgot Password?</a> |
            <a href="/" style="color: #64748b; text-decoration: none;">Back to Home</a>
        </p>

        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
    New supervisor? <a href="/register/supervisor" style="color: #10b981; text-decoration: none; font-weight: 600;">Register staff account</a>
</p>
    </div>

    <script>
        function togglePassword() {
            var p = document.getElementById("loginPass");
            var check = document.getElementById("showPassCheck");
            p.type = check.checked ? "text" : "password";
        }
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
