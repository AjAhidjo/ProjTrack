<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Reset Password | ProjTrack</title>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9; padding: 20px;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; color: #1e293b;">Set a New Password</h2>
        <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
            Choose a new password for {{ email }}.
        </p>

        {% with msgs = get_flashed_messages(with_categories=true) %}
            {% for category, m in msgs %}
                <div class="card flash-msg" style="background: {% if category == 'success' %}#d1fae5{% else %}#fee2e2{% endif %}; color: {% if category == 'success' %}#065f46{% else %}#991b1b{% endif %}; padding:15px; border-radius:8px; margin-bottom:20px; border-left: 5px solid {% if category == 'success' %}#10b981{% else %}#ef4444{% endif %};">
                    {{ m }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label style="font-weight: 600; font-size: 0.85rem;">New Password</label>
            <input type="password" name="new_password" placeholder="••••••••" required minlength="6">

            <label style="font-weight: 600; font-size: 0.85rem;">Confirm New Password</label>
            <input type="password" name="confirm_password" placeholder="••••••••" required minlength="6">

            <button type="submit" style="width: 100%; margin-top: 10px; background: #3b82f6;">Update Password</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
