<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Reset Password | ProjTrack</title>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f1f5f9;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; color: #1e293b;">Forgot Password?</h2>
        <p style="text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">
            Enter your registered email and we'll send a reset link.
        </p>
        
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label style="font-weight: 600; font-size: 0.85rem;">Email Address</label>
            <input type="email" name="email" placeholder="e.g. name@example.com" required>
            
            <button type="submit" style="width: 100%; margin-top: 20px; background: #3b82f6;">Send Reset Link</button>
            <a href="/" style="display: block; text-align: center; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 0.9rem;">Back to Home</a>
        </form>
    </div>
</body>
</html>
